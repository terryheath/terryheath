<style>

/* Ghost theme base is overridden here. All Inkhorn UI uses EB Garamond +

.gh-head,
.gh-foot { display: none !important; }

/* ── AUTHOR DISPLAY ────────────────────────────────────────────────────────── */
/* Every post is authored by the Inkhorn Review account; real contributor
   name is in the custom excerpt. Hide all Ghost author elements. */
.gh-article-meta,
.gh-author-image,
.gh-author-name,
.gh-article-author-image,
.gh-article-meta .gh-author-name { display: none !important; }

.lw-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 24px auto 0;
  max-width: 640px;
  padding: 0 16px;
}
.lw-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px 6px 6px;
  background: #f1f1f1;
  border-radius: 999px;
  text-decoration: none !important;
  color: #333 !important;
  font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

}
.lw-pill:hover { background: #e2e2e2; }
.lw-pill-icon {

  flex-shrink: 0;
}
.lw-pill-icon svg { width: 14px; height: 14px; fill: #fff; }

/* PODCAST — hide web-only listen link (visible in email, hidden on web) */
.lw-listen { display: none; }

/* ── FEATURE IMAGE WIDTH ────────────────────────────────────────────────────── */
.single-media { max-width: 720px; margin-inline: auto; }

/* ── MASTHEAD ───────────────────────────────────────────────────────────────── */

}

/* Subscribe block */

}

}

}

}
.ih-contents-genre-head {

  color: #8f1d1d;

}

}

.ih-card-podcast {

}

.ih-card-label {

  font-size: 25px;

}
/* Light archive card */

/* Gallery band */

}

  display: flex;
  justify-content: space-between;

}

.ih-archive-entry {
  display: flex;

  border-bottom: 1px solid #d6cdbd;

}

/* ── HOME PAGE ────────────────────────────────────────────────────────────── */
.inkhorn-home { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }

/* Current issue */
.ih-issue { display: grid; grid-template-columns: 220px 1fr; gap: 3rem; align-items: start; margin-bottom: 3rem; }
.ih-issue-cover img { width: 100%; height: auto; display: block; }

.ih-issue-desc { font-size: 1rem; line-height: 1.65; color: #444; margin: 0 0 1.2rem; font-style: italic; }

.ih-ebook-links { font-size: .82rem; color: #888; margin-bottom: 1.5rem; }
.ih-ebook-links a { color: #666; text-decoration: none; }

.ih-toc-item a:hover { text-decoration: underline; }
.ih-toc-byline { color: #999; font-style: italic; margin-left: .3rem; font-size: .8rem; }

.ih-section-head { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #888; border-bottom: 2px solid #1a1a1a; padding-bottom: .4rem; margin: 0 0 1.5rem; display: block; }
.ih-hr { border: none; border-top: 1px solid #e8e8e8; margin: 2.5rem 0; }

.ih-dept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem 2.5rem; margin-bottom: .5rem; }
.ih-dept-name { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #bbb; margin-bottom: .35rem; }
.ih-dept-title a { display: block; font-size: .93rem; font-weight: 600; color: #1a1a1a; text-decoration: none; line-height: 1.35; }

.ih-dept-excerpt { font-size: .8rem; color: #777; font-style: italic; margin-top: .2rem; line-height: 1.4; }
.ih-dept-all { font-size: .75rem; color: #aaa; text-decoration: none; margin-top: .5rem; display: inline-block; }

.ih-gallery-band::-webkit-scrollbar { display: none; }
.ih-gallery-item { flex: 0 0 auto; display: block; line-height: 0; }

<!--
  INKHORN REVIEW — CONTRIBUTOR BOOK SHELF + BIO
  ==============================================

  POST PAGES
  ----------
  1. Links the byline. The custom excerpt ("by Barbara Daniels") is plain
     text from Ghost. This script wraps the name in an anchor pointing to
     the contributor's tag page (/tag/{slug}/). Synchronous — no network
     request needed; the slug comes from the body tag class and the name
     text is already in the DOM.

  2. Renders a contributor block at the bottom of the article:
       - contributor name (linked to /tag/{slug}/)
       - bio (from the tag's Ghost description, HTML-escaped)
       - "Books by …" shelf (if the contributor has entries in shelves.json)

     The name/bio come from the Ghost Content API (one GET per page).
     The books come from shelves.json (one GET per page).
     Both fetches fire in parallel via Promise.all.

  TAG PAGES (/tag/{slug}/)
  ------------------------
  Contributor tag pages get a "Books" shelf inserted after the tag header.
  Issue and genre tag pages are ignored.

  HOME PAGE (/)
  -------------
  Rendered entirely client-side from the Content API:
  - Current issue cover, theme line, piece count, read link, ebook links, TOC by genre
  - Department row: latest piece for fiction, nonfiction, poetry, micro, art, podcast, letter
  - Art gallery band (images, scrollable on mobile)
  - Subscribe CTA (Digest primary, issue announcements secondary)
  The Ghost page with slug "home" provides the container; its content is cleared.

  NETWORK COST PER POST PAGE
  --------------------------
  Existing:  1 request — shelves.json (~8 KB, GitHub raw CDN)
  New:       2 requests — shelves.json + Content API tag (~400 B)
  Both fire in parallel; the marginal latency is max(t_shelves, t_api),
  not the sum. The Content API response is a small JSON object.

  To add or update contributor books:
    1. Edit inkhorn/contributors.json
    2. Run: ISBNDB_KEY=<key> node inkhorn/build-shelves.js
    3. Commit and push inkhorn/shelves.json

  To update contributor bios:
    Edit the tag description in Ghost Admin → Tags. No rebuild required.

  If SHELVES_URL ever moves, update the constant below.
-->

<script>

  var isHome = window.location.pathname === '/';

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

          ' style="width:110px;height:auto;display:block;margin-bottom:.5rem">'

      var title = book.title
        ? '<span style="font-size:.95rem;font-weight:600;line-height:1.25">' +
          escapeHtml(book.title) + "</span>"

      var author = book.authors
        ? '<span style="font-size:.8rem;opacity:.65;display:block;margin-top:.15rem">' +
          escapeHtml(book.authors) + "</span>"

    if (window.location.pathname.startsWith('/podcast')) {

    if (hasDesc) {
      inner +=
        '<div style="margin-bottom:' + (hasBooks ? "2rem" : "0") + '">' +
        '<a href="/tag/' + slug + '/"' +
        ' style="display:inline-block;font-size:1.05rem;font-weight:700;' +
        'color:inherit;text-decoration:none;margin-bottom:.6rem">' +
        escapeHtml(name) + "</a>" +
        '<p style="margin:0;font-size:1.1rem;line-height:1.65">' +
        escapeHtml(tagData.description) + "</p>" +
        "</div>";
    }

    if (hasBooks) {
      inner +=
        '<h3 style="font-size:1rem;font-weight:700;margin:0 0 1rem">' +
        "Books by " + escapeHtml(name) + "</h3>" +
        '<div style="display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-start">' +
        buildCards(shelfEntry.books) + "</div>";
    }

    var html =
      '<div style="margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(0,0,0,.1)">' +
      inner + "</div>";

    var content = document.querySelector(".gh-content");
    if (content) content.insertAdjacentHTML("beforeend", html);
  }).catch(function () {});

  // ── THEME-BASED RELATED POSTS ──────────────────────────────────────────────
  // contribTags[0] = contributor slug; [1]+ = theme tags (grief, memory, etc.)
  // Fetches posts sharing a theme tag, shuffles for variety on each page load,
  // replaces .related-feed innerHTML. If the query returns nothing the element
  // is untouched — Handlebars output stands as fallback.
  var themeSlugs = contribTags.slice(1);
  if (themeSlugs.length) {
    var postSlug = window.location.pathname.replace(/\/$/, '').split('/').pop();
    var relFilter = 'tags:[' + themeSlugs.join(',') + ']+slug:-' + postSlug;
    var relUrl =
      GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
      '&filter=' + encodeURIComponent(relFilter) +
      '&limit=6&fields=title,url,published_at,reading_time';

    fetch(relUrl)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var posts = data && data.posts;
        if (!posts || !posts.length) return; // nothing matched — leave Handlebars output

        // Fisher-Yates shuffle for a different order on every page load
        for (var i = posts.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = posts[i]; posts[i] = posts[j]; posts[j] = tmp;
        }

        var feed = document.querySelector('.related-feed');
        if (!feed) return;

        feed.innerHTML = posts.slice(0, 4).map(function (post) {
          var d     = new Date(post.published_at);
          var day   = String(d.getDate()).padStart(2, '0');
          var month = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
          var mins  = post.reading_time || 1;
          var rt    = mins === 1 ? '1 min read' : mins + ' min read';
          return (
            '<article class="feed">' +
            '<div class="feed-calendar">' +
            '<div class="feed-calendar-day">' + day + '</div>' +
            '<div class="feed-calendar-month">' + month + '</div>' +
            '</div>' +
            '<h2 class="feed-title">' + escapeHtml(post.title) + '</h2>' +
            '<div class="feed-right">' +
            '<div class="feed-length">' + rt + '</div>' +
            '</div>' +
            '<a class="u-permalink" href="' + escapeHtml(post.url) +
            '" aria-label="' + escapeHtml(post.title) + '"></a>' +
            '</article>'
          );
        }).join('');
      })
      .catch(function () {}); // on network error, leave Handlebars output alone
  }

  // ── HOME PAGE BUILDER ──────────────────────────────────────────────────────

  // Runs on every page. Fetches the tag list (slug only, lightweight) to find
  // the current issue, then prepends a single dynamic link to the nav <ul>.
  function injectCurrentIssueNav() {
    fetch(GHOST_URL + '/ghost/api/content/tags/?key=' + CONTENT_KEY +
      '&limit=all&fields=slug')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var tags = (data && data.tags) || [];
        var issueTags = tags.filter(function(t) { return ISSUE_RE.test(t.slug); });
        issueTags.sort(function(a, b) { return issueToOrdinal(a.slug) - issueToOrdinal(b.slug); });
        var current = issueTags[issueTags.length - 1];
        if (!current) return;
        var nav = document.querySelector('ul.nav') ||
                  document.querySelector('.gh-navigation-menu ul') ||
                  document.querySelector('nav > ul');
        if (!nav || nav.tagName !== 'UL') return;
        var existing = nav.querySelector('[data-inkhorn-issue]');
        if (existing) existing.parentNode.removeChild(existing);
        var li = document.createElement('li');
        li.setAttribute('data-inkhorn-issue', '1');
        li.innerHTML = '<a href="/' + escapeHtml(current.slug) + '/">' +
                       escapeHtml(formatIssueTitle(current.slug)) + '</a>';
        nav.insertBefore(li, nav.firstChild);
      })
      .catch(function() {});
  }

  function issueToOrdinal(slug) {
    // Returns a sortable integer. autumn=Sep, winter=Dec (of prior year), spring=Mar, summer=Jun.
    var m = slug.match(/^(autumn|winter|spring|summer)-(\d{4})$/);
    if (!m) return 0;
    var monthOf = { autumn: 9, winter: 12, spring: 3, summer: 6 };
    var year = parseInt(m[2]);
    var month = monthOf[m[1]];
    var actualYear = m[1] === 'winter' ? year - 1 : year;
    return actualYear * 100 + month;
  }

  function formatIssueTitle(slug) {
    var m = slug.match(/^(autumn|winter|spring|summer)-(\d{4})$/);
    if (!m) return slug;
    return m[1].charAt(0).toUpperCase() + m[1].slice(1) + ' ' + m[2];
  }

  function deptOfPost(post) {
    if (!post.tags) return null;
    for (var i = 0; i < post.tags.length; i++) {
      var s = post.tags[i].slug;
      if (DEPT_TAGS.indexOf(s) !== -1) return s;
    }
    return null;
  }

  function buildHomePage() {
    // Three parallel fetches: all tags, recent dept posts, recent art posts
    Promise.all([
      fetch(GHOST_URL + '/ghost/api/content/tags/?key=' + CONTENT_KEY +
        '&limit=all&include=count.posts&fields=slug,name,description,feature_image,url')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=' + encodeURIComponent('primary_tag:[fiction,nonfiction,poetry,micro,podcast,letter]') +
        '&fields=title,url,tags,custom_excerpt,feature_image&limit=50&order=published_at+desc')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=tag:art&fields=title,url,feature_image,custom_excerpt,tags&limit=10&order=published_at+desc')
        .then(function(r) { return r.json(); })
    ]).then(function(results) {
      var allTags   = (results[0] && results[0].tags)  || [];
      var deptPosts = (results[1] && results[1].posts) || [];
      var artPosts  = (results[2] && results[2].posts) || [];

      // Find current issue (highest ordinal among published issue tags)
      var issueTags = allTags.filter(function(t) { return ISSUE_RE.test(t.slug); });
      issueTags.sort(function(a, b) { return issueToOrdinal(a.slug) - issueToOrdinal(b.slug); });
      var currentIssue = issueTags[issueTags.length - 1];
      if (!currentIssue) return;

      // Fetch current issue TOC
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=' + encodeURIComponent('primary_tag:' + currentIssue.slug) +
        '&fields=title,url,tags,custom_excerpt&limit=all&order=published_at+asc')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var issuePosts = (data && data.posts) || [];
          renderHome(currentIssue, issuePosts, deptPosts, artPosts);
        });
    }).catch(function() {});
  }

  function renderHome(issue, issuePosts, deptPosts, artPosts) {
    var e = escapeHtml;

    // ── Current issue section ──────────────────────────────────────────────

    var coverHtml = issue.feature_image
      ? '<img src="' + e(issue.feature_image) + '" alt="' + e(formatIssueTitle(issue.slug)) + ' cover" class="ih-cover-img">'
      : '';

    var descHtml = issue.description
      ? '<p class="ih-issue-desc">' + e(issue.description) + '</p>'
      : '';

    var countHtml = (issue.count && issue.count.posts)
      ? '<p style="font-size:.82rem;color:#aaa;margin:0 0 1rem">' + issue.count.posts + ' pieces</p>'
      : '';

    var ebook = EBOOK_LINKS[issue.slug] || null;
    var ebookHtml = '';
    if (ebook && (ebook.apple || ebook.amazon || ebook.kobo)) {
      var links = [];
      if (ebook.apple)  links.push('<a href="' + e(ebook.apple)  + '">Apple Books</a>');
      if (ebook.amazon) links.push('<a href="' + e(ebook.amazon) + '">Amazon</a>');
      if (ebook.kobo)   links.push('<a href="' + e(ebook.kobo)   + '">Kobo</a>');
      ebookHtml = '<p class="ih-ebook-links">Download ebook: ' + links.join(' &nbsp;·&nbsp; ') + '</p>';
    }

    // TOC grouped by genre in display order
    var GENRE_ORDER = ['poetry', 'fiction', 'nonfiction', 'micro', 'art', 'letter'];
    var GENRE_LABELS = { poetry: 'Poetry', fiction: 'Fiction', nonfiction: 'Nonfiction', micro: 'Micro Fiction', art: 'Art', letter: 'Letter' };
    var genreGroups = {};
    var ungrouped = [];
    for (var i = 0; i < issuePosts.length; i++) {
      var p = issuePosts[i];
      var g = deptOfPost(p);
      if (g && GENRE_ORDER.indexOf(g) !== -1) {
        if (!genreGroups[g]) genreGroups[g] = [];
        genreGroups[g].push(p);
      } else {
        ungrouped.push(p);
      }
    }

    var tocHtml = '<nav class="ih-toc">';
    var genresWithContent = GENRE_ORDER.filter(function(g) { return genreGroups[g] && genreGroups[g].length; });
    for (var gi = 0; gi < genresWithContent.length; gi++) {
      var genre = genresWithContent[gi];
      var posts = genreGroups[genre];
      tocHtml += '<div class="ih-toc-genre"><p class="ih-toc-genre-label">' + GENRE_LABELS[genre] + '</p>';
      for (var pi = 0; pi < posts.length; pi++) {
        var post = posts[pi];
        var byline = post.custom_excerpt ? post.custom_excerpt.replace(/^by\s+/i, '') : '';
        tocHtml += '<div class="ih-toc-item"><a href="' + e(post.url) + '">' + e(post.title || 'Untitled') + '</a>';
        if (byline) tocHtml += '<span class="ih-toc-byline">' + e(byline) + '</span>';
        tocHtml += '</div>';
      }
      tocHtml += '</div>';
    }
    tocHtml += '</nav>';

    var issueTitle = formatIssueTitle(issue.slug);
    var issueUrl   = '/' + issue.slug + '/';

    var issueHtml =
      '<section class="ih-issue">' +
      (coverHtml ? '<div class="ih-issue-cover">' + coverHtml + '</div>' : '') +
      '<div class="ih-issue-info">' +
      descHtml + countHtml +
      '<a href="' + e(issueUrl) + '" class="ih-read-link">Read the issue &rarr;</a>' +
      ebookHtml + tocHtml +
      '</div></section>';

    // ── Department row ─────────────────────────────────────────────────────

    // Index deptPosts: one per dept (most recent = first in list, already ordered desc)
    var latestByDept = {};
    for (var di = 0; di < deptPosts.length; di++) {
      var dp = deptPosts[di];
      var dd = deptOfPost(dp);
      if (dd && !latestByDept[dd]) latestByDept[dd] = dp;
    }
    // Also pick up art from artPosts
    if (!latestByDept['art'] && artPosts.length) latestByDept['art'] = artPosts[0];

    var deptGridHtml = '<div class="ih-dept-grid">';
    for (var dti = 0; dti < DEPT_TAGS.length; dti++) {
      var dept = DEPT_TAGS[dti];
      var latest = latestByDept[dept];
      var deptPath = DEPT_PATHS[dept];
      deptGridHtml += '<div class="ih-dept">';
      deptGridHtml += '<p class="ih-dept-name">' + DEPT_LABELS[dept] + '</p>';
      if (latest) {
        var bylineText = latest.custom_excerpt ? latest.custom_excerpt.replace(/^by\s+/i, '') : '';
        deptGridHtml += '<div class="ih-dept-title"><a href="' + e(latest.url) + '">' + e(latest.title || 'Untitled') + '</a></div>';
        if (bylineText) deptGridHtml += '<p class="ih-dept-excerpt">' + e(bylineText) + '</p>';
      }
      deptGridHtml += '<a href="' + e(deptPath) + '" class="ih-dept-all">More ' + DEPT_LABELS[dept].toLowerCase() + ' &rarr;</a>';
      deptGridHtml += '</div>';
    }
    deptGridHtml += '</div>';

    var deptSectionHtml =
      '<section>' +
      '<span class="ih-section-head">Departments</span>' +
      deptGridHtml +
      '</section>';

    // ── Art gallery ────────────────────────────────────────────────────────

    var galleryItems = artPosts.filter(function(p) { return p.feature_image; }).slice(0, 8);
    var galleryHtml = '';
    if (galleryItems.length) {
      var band = '<div class="ih-gallery-band">';
      for (var ai = 0; ai < galleryItems.length; ai++) {
        var ap = galleryItems[ai];
        band +=
          '<a href="' + e(ap.url) + '" class="ih-gallery-item">' +
          '<img src="' + e(ap.feature_image) + '" alt="" class="ih-gallery-img" loading="lazy">' +
          '</a>';
      }
      band += '</div>';
      galleryHtml =
        '<section>' +
        '<span class="ih-section-head">Art</span>' +
        '<div class="ih-gallery-section">' + band + '</div>' +
        '</section>';
    }

    // ── Subscribe CTA ──────────────────────────────────────────────────────

    var subUrl = GHOST_URL + '/#/portal/account/newsletters';
    var subscribeHtml =
      '<section class="ih-subscribe">' +
      '<p class="ih-subscribe-head">The Inkhorn Review Digest</p>' +
      '<p class="ih-subscribe-body">A weekly email with new work from the journal — fiction, nonfiction, poetry, and art.</p>' +
      '<p class="ih-subscribe-cta"><a href="' + e(GHOST_URL) + '/#/portal/signup">Subscribe free</a></p>' +
      '<p class="ih-subscribe-secondary">Also available: <a href="' + e(subUrl) + '">issue announcements</a> and <a href="' + e(subUrl) + '">Weekly Micro Fiction</a>.</p>' +
      '</section>';

    // ── Assemble and inject ────────────────────────────────────────────────

    var homeHtml =
      '<div class="inkhorn-home">' +
      issueHtml +
      '<hr class="ih-hr">' +
      deptSectionHtml +
      (galleryHtml ? '<hr class="ih-hr">' + galleryHtml : '') +
      '<hr class="ih-hr">' +
      subscribeHtml +
      '</div>';

    // Clear Ghost page content and inject home page
    var articleHeader = document.querySelector('.gh-article-header');
    var content = document.querySelector('.gh-content');
    if (articleHeader) articleHeader.style.display = 'none';
    if (content) {
      content.innerHTML = homeHtml;
    } else {
      // Fallback: append to main article element
      var article = document.querySelector('.gh-article') || document.querySelector('main');
      if (article) article.innerHTML = homeHtml;
    }

    // Size gallery to actual client width (excludes scrollbar — avoids 100vw overflow).
    var gallerySection = document.querySelector('.ih-gallery-section');
    if (gallerySection) {
      var clientW = document.documentElement.clientWidth;
      var galleryLeft = gallerySection.getBoundingClientRect().left;
      gallerySection.style.width = clientW + 'px';
      gallerySection.style.marginLeft = (-galleryLeft) + 'px';
    }
  }

})();
</script>

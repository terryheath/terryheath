<!--
  POETRY SPACING
  Poems entered with indentation use the .inkhorn-poem wrapper (HTML card).
  white-space: pre-wrap preserves all leading spaces and blank lines exactly.
  poem-wrap.js outputs the correct HTML card from a plain-text poem file.
-->
<style>
.inkhorn-poem {
  white-space: pre-wrap;
  font-family: inherit;
  font-size: inherit;
  line-height: 1.8;
  margin: 0;
}

/* ── HOME PAGE ────────────────────────────────────────────────────────────── */
/* Header injection zeros .gh-article/.gh-content constraints before JS runs.
   .inkhorn-home then centres itself via max-width + margin:auto. */
.inkhorn-home { max-width: 1100px; margin: 0 auto; padding: 0 24px 64px; }

/* Current issue */
.ih-issue { display: grid; grid-template-columns: 2fr 1fr; gap: 48px; align-items: start; margin-bottom: 48px; }
.ih-issue-cover-link { display: block; }
.ih-issue-cover-link img { width: 100%; height: auto; display: block; }
.ih-issue-desc { font-size: 16px; line-height: 1.65; color: #444; margin: 0 0 22px; font-style: italic; }

/* Issue name — left column, above cover */
.ih-issue-name { font-size: 22px; font-weight: 700; color: #1a1a1a; margin: 0 0 12px; line-height: 1.2; }

/* TOC parent label — right column, above genre list */
.ih-toc-head { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #888; margin: 0 0 14px; }

/* TOC */
.ih-toc { margin-top: 4px; }
.ih-toc-genre { margin-bottom: 16px; }
.ih-toc-genre-label { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #bbb; border-bottom: 1px solid #ebebeb; padding-bottom: 5px; margin: 0 0 8px; }
.ih-toc-item { font-size: 13px; line-height: 1.4; margin-bottom: 4px; }
.ih-toc-item a { color: #1a1a1a; text-decoration: none; }
.ih-toc-item a:hover { text-decoration: underline; }
.ih-toc-byline { color: #999; font-style: italic; margin-left: 5px; font-size: 13px; }

/* Section headings */
.ih-section-head { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #888; border-bottom: 2px solid #1a1a1a; padding-bottom: 6px; margin: 0 0 24px; display: block; }
.ih-hr { border: none; border-top: 1px solid #e8e8e8; margin: 40px 0; }

/* Department grid: two columns — left stacks micro + colophon, right is podcast */
.ih-dept-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.ih-dept-col { display: flex; flex-direction: column; gap: 32px; }
.ih-dept-name { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #bbb; margin-bottom: 6px; }
.ih-dept-title a { display: block; font-size: 15px; font-weight: 600; color: #1a1a1a; text-decoration: none; line-height: 1.35; }
.ih-dept-title a:hover { text-decoration: underline; }
.ih-dept-excerpt { font-size: 13px; color: #777; font-style: italic; margin-top: 3px; line-height: 1.4; }
.ih-dept-podcast { display: flex; gap: 12px; align-items: flex-start; }
.ih-dept-headshot { width: 96px; height: 96px; object-fit: cover; flex-shrink: 0; border-radius: 2px; }
.ih-dept-body { flex: 1; min-width: 0; }

/* Art gallery — full-bleed, images only. Width/offset set by JS after injection. */
.ih-gallery-section { position: relative; overflow: hidden; }
.ih-gallery-band { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.ih-gallery-band::-webkit-scrollbar { display: none; }
.ih-gallery-item { flex: 0 0 auto; display: block; line-height: 0; }
.ih-gallery-img { height: 260px !important; width: auto !important; max-width: none !important; display: block; }

/* Art collection page masonry grid */
.ih-art-grid-wrapper { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; }
.ih-art-grid { column-count: 3; column-gap: 16px; }
.ih-art-item { break-inside: avoid; margin-bottom: 16px; display: block; line-height: 0; }
.ih-art-item img { width: 100%; height: auto; display: block; }
@media (max-width: 900px) { .ih-art-grid { column-count: 2; } }
@media (max-width: 480px) { .ih-art-grid-wrapper { padding: 0 16px 32px; } .ih-art-grid { column-count: 1; } }

/* Patreon supporters */
.ih-patrons { margin-top: 16px; }
.ih-patrons-label { font-size: 12px; color: #777; margin: 0; line-height: 1.5; }
.ih-patrons-label a { color: inherit; text-decoration: underline; text-decoration-color: #bbb; text-underline-offset: 0.15em; }
.ih-patrons-label a:hover { text-decoration-color: #555; }
.ih-patrons-names { font-size: 12px; color: #777; margin: 6px 0 0; line-height: 1.6; }

/* Subscribe */
.ih-subscribe { background: #f7f7f7; border-radius: 3px; padding: 32px 40px; text-align: center; margin-top: 16px; }
.ih-subscribe-head { font-size: 17px; font-weight: 700; margin: 0 0 8px; color: #1a1a1a; }
.ih-subscribe-body { font-size: 15px; color: #555; margin: 0 0 12px; line-height: 1.55; }
.ih-subscribe-cta a { display: inline-block; background: #1a1a1a; color: #fff !important; font-size: 14px; font-weight: 700; padding: 10px 24px; border-radius: 3px; text-decoration: none !important; }
.ih-subscribe-secondary { font-size: 13px; color: #aaa; margin-top: 12px; }
.ih-subscribe-secondary a { color: #888; }

@media (max-width: 720px) {
  .ih-issue { grid-template-columns: 1fr; gap: 24px; }
  .ih-issue-cover { max-width: 55vw; }
  .ih-dept-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .ih-dept-grid { grid-template-columns: 1fr; }
  .inkhorn-home { padding: 0 16px 48px; }
}

<!--
  INKHORN REVIEW — CONTRIBUTOR BOOK SHELF + BIO
  ==============================================

  POST PAGES
  ----------
  1. Links the byline. The custom excerpt ("by Barbara Daniels") is plain
     text from Ghost. This script wraps the name in an anchor pointing to
     the contributor's tag page (/tag/{slug}/). Synchronous — no network
     request needed; the slug comes from the body tag class and the name
     text is already in the DOM.

  2. Renders a contributor block at the bottom of the article:
       - contributor name (linked to /tag/{slug}/)
       - bio (from the tag's Ghost description, HTML-escaped)
       - "Books by …" shelf (if the contributor has entries in shelves.json)

     The name/bio come from the Ghost Content API (one GET per page).
     The books come from shelves.json (one GET per page).
     Both fetches fire in parallel via Promise.all.

  TAG PAGES (/tag/{slug}/)
  ------------------------
  Contributor tag pages get a "Books" shelf inserted after the tag header.
  Issue and genre tag pages are ignored.

  HOME PAGE (/)
  -------------
  Rendered entirely client-side from the Content API:
  - Current issue cover, theme line, piece count, read link, ebook links, TOC by genre
  - Department row: latest piece for fiction, nonfiction, poetry, micro, art, podcast, letter
  - Art gallery band (images, scrollable on mobile)
  - Subscribe CTA (Digest primary, issue announcements secondary)
  The Ghost page with slug "home" provides the container; its content is cleared.

  NETWORK COST PER POST PAGE
  --------------------------
  Existing:  1 request — shelves.json (~8 KB, GitHub raw CDN)
  New:       2 requests — shelves.json + Content API tag (~400 B)
  Both fire in parallel; the marginal latency is max(t_shelves, t_api),
  not the sum. The Content API response is a small JSON object.

  To add or update contributor books:
    1. Edit inkhorn/contributors.json
    2. Run: ISBNDB_KEY=<key> node inkhorn/build-shelves.js
    3. Commit and push inkhorn/shelves.json

  To update contributor bios:
    Edit the tag description in Ghost Admin → Tags. No rebuild required.

  If SHELVES_URL ever moves, update the constant below.
-->

<script>
(function () {

  var ATTRIBUTIONS_URL  = "https://raw.githubusercontent.com/terryheath/terryheath/main/inkhorn/attributions.json";
  var GHOST_URL    = "https://inkhornreview.com";

  var isHome = window.location.pathname === '/';

  var isTag  = document.body.classList.contains("tag-template");

  // Current-issue nav link runs on every page before any early returns.
  injectCurrentIssueNav();

  // ── HOME PAGE ──────────────────────────────────────────────────────────────
  if (isHome) {

  }

  if (!isPost && !isTag) return;

  // Collect non-issue, non-genre tag slugs from body classes.
  // After SKIP fix: tags[0] is the contributor slug.
  function getContribTags() {
    var tags = [];
    document.body.className.split(/\s+/).forEach(function (cls) {

      var s = cls.slice(4);
      if (!SKIP.test(s) && s.indexOf("hash-") !== 0) tags.push(s);
    });
    return tags;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  // Extract the src of the first <img> in a Ghost HTML body string.
  // Used for art posts where the content image is in the body, not feature_image.
  function firstBodyImg(html) {
    if (!html) return null;
    var m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : null;
  }

  function buildCards(books) {
    return books.map(function (book) {
      var img = book.cover
        ? '<img src="' + escapeHtml(book.cover) +
          '" alt="' + escapeHtml(book.title || "") +
          '" onerror="this.remove()"' +
          ' style="width:110px;height:auto;display:block;margin-bottom:.5rem">'

      if (loadMore) loadMore.style.display = 'none';

      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=primary_tag:art&fields=title,url,feature_image,html&limit=all&order=published_at+desc')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var posts = (data && data.posts) || [];
          var items = posts.filter(function(p) {
            return firstBodyImg(p.html) || p.feature_image;
          });
          if (!items.length) return;
          var gridHtml = '<div class="ih-art-grid">';
          for (var i = 0; i < items.length; i++) {
            var src = firstBodyImg(items[i].html) || items[i].feature_image;
            gridHtml +=
              '<a href="' + escapeHtml(items[i].url) + '" class="ih-art-item">' +
              '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(items[i].title || '') + '" loading="lazy">' +
              '</a>';
          }
          gridHtml += '</div>';
          var feed = document.querySelector('.post-feed');
          if (feed) {
            var wrapper = document.createElement('div');
            wrapper.className = 'ih-art-grid-wrapper';
            wrapper.innerHTML = gridHtml;
            feed.parentNode.replaceChild(wrapper, feed);
          }
        })
        .catch(function() {});
      return;
    }

    return;
  }

  // ── POST PAGE ──────────────────────────────────────────────────────────────
  var contribTags = getContribTags();
  if (!contribTags.length) return;
  var slug = contribTags[0]; // contributor slug — correct after SKIP fix

  // Link the byline synchronously. The name is already in the DOM as plain
  // text inside .single-excerpt ("by Barbara Daniels"). No request needed.
  var excerptEl = document.querySelector(".single-excerpt");
  if (excerptEl) {
    var raw = excerptEl.textContent.trim();
    if (/^by\s/.test(raw)) {
      excerptEl.innerHTML =
        "by " +
        '<a href="/tag/' + slug + '/"' +
        ' style="color:inherit;text-decoration:underline;' +
        'text-decoration-color:rgba(0,0,0,.25);text-underline-offset:.1em">' +
        escapeHtml(raw.replace(/^by\s+/, "")) + "</a>";
    }
  }

  // Fetch shelves.json (books) and the Content API tag (name + bio) in parallel.
  var tagApiUrl =
    GHOST_URL + "/ghost/api/content/tags/slug/" + slug +
    "/?key=" + CONTENT_KEY + "&fields=name,description";

  Promise.all([
    fetch(SHELVES_URL).then(function (r) { return r.json(); }),
    fetch(tagApiUrl).then(function (r) { return r.json(); })
  ]).then(function (results) {
    var shelves = results[0];
    var tagResp = results[1];

    var tagData = (tagResp && tagResp.tags && tagResp.tags[0]) || null;

    // Find books for this contributor (check all non-skipped tags in case
    // the shelves key differs slightly from the body-class slug).
    var shelfEntry = null;
    for (var i = 0; i < contribTags.length; i++) {
      if (shelves[contribTags[i]]) { shelfEntry = shelves[contribTags[i]]; break; }
    }

    var hasDesc  = tagData && tagData.description;
    var hasBooks = shelfEntry && shelfEntry.books && shelfEntry.books.length;
    if (!hasDesc && !hasBooks) return;

    var name = (tagData && tagData.name) || (shelfEntry && shelfEntry.name) || "";

    var inner = "";

    if (hasDesc) {
      inner +=
        '<div style="margin-bottom:' + (hasBooks ? "2rem" : "0") + '">' +
        '<a href="/tag/' + slug + '/"' +
        ' style="display:inline-block;font-size:1.05rem;font-weight:700;' +
        'color:inherit;text-decoration:none;margin-bottom:.6rem">' +
        escapeHtml(name) + "</a>" +
        '<p style="margin:0;font-size:1.1rem;line-height:1.65">' +
        escapeHtml(tagData.description) + "</p>" +
        "</div>";
    }

    if (hasBooks) {
      inner +=
        '<h3 style="font-size:1rem;font-weight:700;margin:0 0 1rem">' +
        "Books by " + escapeHtml(name) + "</h3>" +
        '<div style="display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-start">' +
        buildCards(shelfEntry.books) + "</div>";
    }

    var html =
      '<div style="margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(0,0,0,.1)">' +
      inner + "</div>";

    var content = document.querySelector(".gh-content");
    if (content) content.insertAdjacentHTML("beforeend", html);
  }).catch(function () {});

  // ── THEME-BASED RELATED POSTS ──────────────────────────────────────────────
  // contribTags[0] = contributor slug; [1]+ = theme tags (grief, memory, etc.)
  // Fetches posts sharing a theme tag, shuffles for variety on each page load,
  // replaces .related-feed innerHTML. If the query returns nothing the element
  // is untouched — Handlebars output stands as fallback.
  var themeSlugs = contribTags.slice(1);
  if (themeSlugs.length) {
    var postSlug = window.location.pathname.replace(/\/$/, '').split('/').pop();
    var relFilter = 'tags:[' + themeSlugs.join(',') + ']+slug:-' + postSlug;
    var relUrl =
      GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
      '&filter=' + encodeURIComponent(relFilter) +
      '&limit=6&fields=title,url,published_at,reading_time';

    fetch(relUrl)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var posts = data && data.posts;
        if (!posts || !posts.length) return; // nothing matched — leave Handlebars output

        // Fisher-Yates shuffle for a different order on every page load
        for (var i = posts.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = posts[i]; posts[i] = posts[j]; posts[j] = tmp;
        }

        var feed = document.querySelector('.related-feed');
        if (!feed) return;

        feed.innerHTML = posts.slice(0, 4).map(function (post) {
          var d     = new Date(post.published_at);
          var day   = String(d.getDate()).padStart(2, '0');
          var month = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
          var mins  = post.reading_time || 1;
          var rt    = mins === 1 ? '1 min read' : mins + ' min read';
          return (
            '<article class="feed">' +
            '<div class="feed-calendar">' +
            '<div class="feed-calendar-day">' + day + '</div>' +
            '<div class="feed-calendar-month">' + month + '</div>' +
            '</div>' +
            '<h2 class="feed-title">' + escapeHtml(post.title) + '</h2>' +
            '<div class="feed-right">' +
            '<div class="feed-length">' + rt + '</div>' +
            '</div>' +
            '<a class="u-permalink" href="' + escapeHtml(post.url) +
            '" aria-label="' + escapeHtml(post.title) + '"></a>' +
            '</article>'
          );
        }).join('');
      })
      .catch(function () {}); // on network error, leave Handlebars output alone
  }

  // ── HOME PAGE BUILDER ──────────────────────────────────────────────────────

  // Runs on every page. Fetches the tag list (slug only, lightweight) to find
  // the current issue, then prepends a single dynamic link to the nav <ul>.
  function injectCurrentIssueNav() {
    fetch(GHOST_URL + '/ghost/api/content/tags/?key=' + CONTENT_KEY +
      '&limit=all&fields=slug')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var tags = (data && data.tags) || [];
        var issueTags = tags.filter(function(t) { return ISSUE_RE.test(t.slug); });
        issueTags.sort(function(a, b) { return issueToOrdinal(a.slug) - issueToOrdinal(b.slug); });
        var current = issueTags[issueTags.length - 1];
        if (!current) return;
        var nav = document.querySelector('ul.nav') ||
                  document.querySelector('.gh-navigation-menu ul') ||
                  document.querySelector('nav > ul');
        if (!nav || nav.tagName !== 'UL') return;
        var existing = nav.querySelector('[data-inkhorn-issue]');
        if (existing) existing.parentNode.removeChild(existing);
        var li = document.createElement('li');
        li.setAttribute('data-inkhorn-issue', '1');
        li.innerHTML = '<a href="/' + escapeHtml(current.slug) + '/">' +
                       escapeHtml(formatIssueTitle(current.slug)) + '</a>';
        nav.insertBefore(li, nav.firstChild);
      })
      .catch(function() {});
  }

  function issueToOrdinal(slug) {
    // Returns a sortable integer. autumn=Sep, winter=Dec (of prior year), spring=Mar, summer=Jun.
    var m = slug.match(/^(autumn|winter|spring|summer)-(\d{4})$/);
    if (!m) return 0;
    var monthOf = { autumn: 9, winter: 12, spring: 3, summer: 6 };
    var year = parseInt(m[2]);
    var month = monthOf[m[1]];
    var actualYear = m[1] === 'winter' ? year - 1 : year;
    return actualYear * 100 + month;
  }

  function formatIssueTitle(slug) {
    var m = slug.match(/^(autumn|winter|spring|summer)-(\d{4})$/);
    if (!m) return slug;
    return m[1].charAt(0).toUpperCase() + m[1].slice(1) + ' ' + m[2];
  }

  function deptOfPost(post) {
    if (!post.tags) return null;
    for (var i = 0; i < post.tags.length; i++) {
      var s = post.tags[i].slug;
      if (DEPT_TAGS.indexOf(s) !== -1) return s;
    }
    return null;
  }

  function buildHomePage() {
    var revealed = false;

    // Restore the cover hero + page title if the API fails or takes > 5 s.
    // In the success path renderHome sets display:none (hiding them permanently);
    // calling revealPage after that is a no-op because revealed is already true.
    function revealPage() {
      if (revealed) return;
      revealed = true;
      ['.cover', '.single-header'].forEach(function(sel) {
        var el = document.querySelector(sel);
        if (el) el.style.opacity = '1';
      });
    }

    var failsafe = setTimeout(revealPage, 5000);

    Promise.all([
      fetch(GHOST_URL + '/ghost/api/content/tags/?key=' + CONTENT_KEY +
        '&limit=all&include=count.posts&fields=slug,name,description,feature_image,url')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=primary_tag:micro&fields=title,url,custom_excerpt&limit=1&order=published_at+desc')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=primary_tag:podcast&fields=title,url,custom_excerpt,feature_image&limit=1&order=published_at+desc')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=primary_tag:letter&fields=title,url,custom_excerpt&limit=1&order=published_at+desc')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=primary_tag:art&fields=title,url,feature_image,html&limit=12&order=published_at+desc')
        .then(function(r) { return r.json(); }),
      fetch(GHOST_URL + '/ghost/api/content/pages/?key=' + CONTENT_KEY +
        '&filter=slug:patreon-supporters&fields=html')
        .then(function(r) { return r.json(); })
        .catch(function() { return null; })
    ]).then(function(results) {
      var allTags        = (results[0] && results[0].tags)  || [];
      var microPost      = results[1] && results[1].posts && results[1].posts[0] || null;
      var podcastPost    = results[2] && results[2].posts && results[2].posts[0] || null;
      var colophonPost   = results[3] && results[3].posts && results[3].posts[0] || null;
      var artPosts       = (results[4] && results[4].posts) || [];
      var patronPageResp = results[5] || null;

      var issueTags = allTags.filter(function(t) { return ISSUE_RE.test(t.slug); });
      issueTags.sort(function(a, b) { return issueToOrdinal(a.slug) - issueToOrdinal(b.slug); });
      var currentIssue = issueTags[issueTags.length - 1];
      if (!currentIssue) { clearTimeout(failsafe); revealPage(); return; }

      // TOC fetch — &include=tags is required; listing 'tags' in &fields does nothing.
      fetch(GHOST_URL + '/ghost/api/content/posts/?key=' + CONTENT_KEY +
        '&filter=' + encodeURIComponent('primary_tag:' + currentIssue.slug) +
        '&fields=title,url,custom_excerpt&include=tags&limit=all&order=published_at+asc')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          clearTimeout(failsafe);
          revealed = true; // success: renderHome hides cover + single-header via display:none
          var issuePosts = (data && data.posts) || [];
          renderHome(currentIssue, issuePosts, microPost, podcastPost, colophonPost, artPosts, patronPageResp);
        })
        .catch(function() { clearTimeout(failsafe); revealPage(); });
    }).catch(function() { clearTimeout(failsafe); revealPage(); });
  }

  function renderHome(issue, issuePosts, microPost, podcastPost, colophonPost, artPosts, patronPageResp) {
    var e = escapeHtml;
    var issueUrl = '/' + issue.slug + '/';

    // ── Cover ─────────────────────────────────────────────────────────────────
    // ISSUE_COVERS[slug]: set to ebook/print cover URL once uploaded.
    // Falls back to the issue tag's feature_image (cover art already on site).
    var coverSrc = ISSUE_COVERS[issue.slug] || issue.feature_image || null;
    var coverHtml = coverSrc
      ? '<a href="' + e(issueUrl) + '" class="ih-issue-cover-link">' +
        '<img src="' + e(coverSrc) + '" alt="' + e(formatIssueTitle(issue.slug)) + ' cover">' +
        '</a>'
      : '';

    // ── TOC ───────────────────────────────────────────────────────────────────
    // Grouped by genre. include=tags on the fetch populates post.tags;
    // ungrouped posts (no genre tag) are rendered last without a heading.
    var GENRE_ORDER  = ['poetry', 'fiction', 'nonfiction', 'micro', 'art', 'letter'];
    var GENRE_LABELS = { poetry: 'Poetry', fiction: 'Fiction', nonfiction: 'Nonfiction',
                         micro: 'Micro Fiction', art: 'Art', letter: 'Colophon' };
    var genreGroups = {}, ungrouped = [];
    for (var i = 0; i < issuePosts.length; i++) {
      var p = issuePosts[i];
      var g = deptOfPost(p);
      if (g && GENRE_ORDER.indexOf(g) !== -1) {
        if (!genreGroups[g]) genreGroups[g] = [];
        genreGroups[g].push(p);
      } else {
        ungrouped.push(p);
      }
    }

    // Format: Author, <a>Title</a>
    function tocEntry(post) {
      var author = post.custom_excerpt ? post.custom_excerpt.replace(/^by\s+/i, '').trim() : '';
      return '<div class="ih-toc-item">' +
             (author ? e(author) + ', ' : '') +
             '<a href="' + e(post.url) + '">' + e(post.title || 'Untitled') + '</a>' +
             '</div>';
    }

    var tocHtml = '<nav class="ih-toc">';
    var activeGenres = GENRE_ORDER.filter(function(g) { return genreGroups[g] && genreGroups[g].length; });
    for (var gi = 0; gi < activeGenres.length; gi++) {
      var genre = activeGenres[gi];
      tocHtml += '<div class="ih-toc-genre"><p class="ih-toc-genre-label">' + GENRE_LABELS[genre] + '</p>';
      var gPosts = genreGroups[genre];
      for (var pi = 0; pi < gPosts.length; pi++) tocHtml += tocEntry(gPosts[pi]);
      tocHtml += '</div>';
    }
    if (ungrouped.length) {
      tocHtml += '<div class="ih-toc-genre">';
      for (var ui = 0; ui < ungrouped.length; ui++) tocHtml += tocEntry(ungrouped[ui]);
      tocHtml += '</div>';
    }
    tocHtml += '</nav>';

    var descHtml = issue.description
      ? '<p class="ih-issue-desc">' + e(issue.description) + '</p>'
      : '';

    // ── Patreon supporters ────────────────────────────────────────────────────
    // Parsed here so the block embeds inside the cover column, below the image.
    var patronData = (function() {
      var html = patronPageResp && patronPageResp.pages && patronPageResp.pages[0] && patronPageResp.pages[0].html;
      if (!html) return null;
      try {
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        var el = tmp.querySelector('#ih-patron-data');
        if (!el) return null;
        return {
          names: JSON.parse(el.getAttribute('data-names') || '[]'),
          anonymous: parseInt(el.getAttribute('data-anonymous') || '0') || 0
        };
      } catch(x) { return null; }
    })();

    var patronNamesHtml = '';
    if (patronData && patronData.names && patronData.names.length) {
      var pParts = patronData.names.map(function(n) { return e(n); });
      if (patronData.anonymous > 0) {
        pParts.push('and ' + patronData.anonymous +
          ' anonymous ' + (patronData.anonymous === 1 ? 'supporter' : 'supporters'));
      }
      patronNamesHtml = '<p class="ih-patrons-names">' + pParts.join(', ') + '</p>';
    } else if (patronData && patronData.anonymous > 0) {
      patronNamesHtml = '<p class="ih-patrons-names">' + patronData.anonymous +
        ' anonymous ' + (patronData.anonymous === 1 ? 'supporter' : 'supporters') + '</p>';
    }

    var patreonBlockHtml =
      '<div class="ih-patrons">' +
      '<p class="ih-patrons-label"><em>Inkhorn Review</em> is made possible in part by the generous' +
      ' support of our <a href="https://www.patreon.com/cw/inkhornreview"' +
      ' target="_blank" rel="noopener">Patreon subscribers</a>.</p>' +
      patronNamesHtml +
      '</div>';

    var issueHtml =
      '<section class="ih-issue">' +
      '<div class="ih-issue-cover">' + (coverHtml || '') + patreonBlockHtml + '</div>' +
      '<div class="ih-issue-info">' +
      '<h2 class="ih-issue-name">' + e(formatIssueTitle(issue.slug)) + '</h2>' +
      descHtml +
      '<p class="ih-toc-head">Table of Contents</p>' +
      tocHtml + '</div>' +
      '</section>';

    // ── Departments ───────────────────────────────────────────────────────────
    // Left column: Micro Fiction + Colophon stacked.
    // Right column: Podcast (headshot + excerpt).
    // A dept with no post renders nothing; empty column is omitted entirely.
    function renderDept(label, post, headshot) {
      if (!post) return '';
      var dp = post;
      var dByline = dp.custom_excerpt ? dp.custom_excerpt.replace(/^by\s+/i, '').trim() : '';
      var cell = '<div class="ih-dept"><p class="ih-dept-name">' + label + '</p>';
      if (headshot && dp.feature_image) {
        cell +=
          '<div class="ih-dept-podcast">' +
          '<img src="' + e(dp.feature_image) + '" alt="" class="ih-dept-headshot">' +
          '<div class="ih-dept-body">' +
          '<div class="ih-dept-title"><a href="' + e(dp.url) + '">' + e(dp.title || 'Untitled') + '</a></div>' +
          (dByline ? '<p class="ih-dept-excerpt">' + e(dByline) + '</p>' : '') +
          '</div></div>';
      } else {
        cell += '<div class="ih-dept-title"><a href="' + e(dp.url) + '">' + e(dp.title || 'Untitled') + '</a></div>';
        if (dByline) cell += '<p class="ih-dept-excerpt">' + e(dByline) + '</p>';
      }
      cell += '</div>';
      return cell;
    }

    var leftCells = renderDept('Micro Fiction', microPost, false) +
                    renderDept('Colophon', colophonPost, false);
    var rightCell = renderDept('Podcast', podcastPost, true);

    var deptSectionHtml = '';
    if (leftCells || rightCell) {
      deptSectionHtml =
        '<hr class="ih-hr"><section><span class="ih-section-head">Departments</span>' +
        '<div class="ih-dept-grid">' +
        (leftCells ? '<div class="ih-dept-col">' + leftCells + '</div>' : '') +
        (rightCell ? '<div class="ih-dept-col">' + rightCell + '</div>' : '') +
        '</div></section>';
    }

    // ── Art gallery ───────────────────────────────────────────────────────────
    var galleryItems = artPosts.filter(function(p) { return firstBodyImg(p.html) || p.feature_image; });
    var galleryHtml = '';
    if (galleryItems.length) {
      var band = '<div class="ih-gallery-band">';
      for (var ai = 0; ai < galleryItems.length; ai++) {
        var galSrc = firstBodyImg(galleryItems[ai].html) || galleryItems[ai].feature_image;
        band +=
          '<a href="' + e(galleryItems[ai].url) + '" class="ih-gallery-item">' +
          '<img src="' + e(galSrc) + '" alt="" class="ih-gallery-img" loading="lazy">' +
          '</a>';
      }
      band += '</div>';
      galleryHtml = '<hr class="ih-hr"><section><div class="ih-gallery-section">' + band + '</div></section>';
    }

    // ── Subscribe CTA ─────────────────────────────────────────────────────────
    var subscribeHtml =
      '<hr class="ih-hr"><section class="ih-subscribe">' +
      '<p class="ih-subscribe-head">The Inkhorn Review Digest</p>' +
      '<p class="ih-subscribe-body">A weekly note of what&rsquo;s new at the journal &mdash; recent pieces, open issues, and links.</p>' +
      '<p class="ih-subscribe-cta"><a href="' + e(GHOST_URL) + '/#/portal/signup">Subscribe free</a></p>' +
      '<p class="ih-subscribe-secondary">Also available: <a href="' + e(GHOST_URL) + '/#/portal/signup">issue announcements</a> and <a href="' + e(GHOST_URL) + '/#/portal/account/newsletters">Weekly Micro Fiction</a>.</p>' +
      '</section>';

    // ── Assemble and inject ───────────────────────────────────────────────────
    var homeHtml =
      '<div class="inkhorn-home">' +
      issueHtml + deptSectionHtml + galleryHtml + subscribeHtml +
      '</div>';

    var content = document.querySelector('.gh-content');
    var ghArticle = document.querySelector('.gh-article');

    // Success path: permanently hide the cover hero and page title.
    ['.cover', '.single-header'].forEach(function(sel) {
      var el = document.querySelector(sel);
      if (el) el.style.display = 'none';
    });

    // Reinforce the header injection's layout zeroing with setProperty so the
    // JS override wins even if something re-asserts the theme CSS at runtime.
    // display:block kills Casper's .gh-canvas grid on .gh-content.
    [ghArticle, content].forEach(function(el) {
      if (!el) return;
      el.style.setProperty('max-width', 'none', 'important');
      el.style.setProperty('padding',   '0',    'important');
      el.style.setProperty('margin',    '0',    'important');
    });
    if (content) {
      content.style.setProperty('display', 'block', 'important');
      content.innerHTML = homeHtml;
    } else {
      var fallback = document.querySelector('main');
      if (fallback) fallback.innerHTML = homeHtml;
    }

    // Full-bleed gallery
    var gallerySection = document.querySelector('.ih-gallery-section');
    if (gallerySection) {
      var clientW = document.documentElement.clientWidth;
      var galleryLeft = gallerySection.getBoundingClientRect().left;
      gallerySection.style.width = clientW + 'px';
      gallerySection.style.marginLeft = (-galleryLeft) + 'px';
    }
  }

})();
</script>

<script>
// Append ISSN below the theme-rendered copyright line in the site footer.
// The .gh-copyright div is owned by the Casper theme and cannot be edited
// without forking the theme, so it is patched here instead.
(function () {
  var cp = document.querySelector('.gh-copyright');
  if (cp && cp.textContent.indexOf('ISSN') === -1) {
    cp.insertAdjacentHTML('beforeend',
      '<br><span style="font-size:.85em;opacity:.7">ISSN 3144-1998 (Online)</span>');
  }
})();
</script>

# Generated by scripts/gen-routes.cjs — edit data/issues.json, not this file.
routes:
  /:
    template: home
    data: page.home

  /submit/:
    template: submit
  /events/:
    template: events
  /weird-friday/:
    template: weird-friday
  /bookfolk/:
    template: bookfolk
  /support/:
    template: support

  /shop/:
    template: page-books
    data: page.books
  /shop/print-edition/:
    template: page
    data: page.print-edition
  /shop/cart/:
    template: page-cart
    data: page.cart
  /shop/order-complete/:
    template: page-order-complete
    data: page.order-complete
  /shop/address/:
    template: page-address
    data: page.address

  /white-rabbit/no-1/:
    template: white-rabbit-issue

  /review/issues/:
    template: review-issues
  /review/founder-letter/:
    controller: channel
    template: tag-letter
    filter: tag:letter
    data: tag.letter
    order: published_at desc
  /review/autumn-2026/:
    template: edition
    data: tag.autumn-2026
  /review/winter-2026/:
    template: edition
    data: tag.winter-2026

  /poetry/:
    controller: channel
    template: tag-poetry
    filter: tag:poetry
    data: tag.poetry
    order: published_at desc
    limit: 999
  /fiction/:
    controller: channel
    template: tag-fiction
    filter: tag:fiction
    data: tag.fiction
    order: published_at desc
    limit: 999
  /nonfiction/:
    controller: channel
    template: tag-nonfiction
    filter: tag:nonfiction
    data: tag.nonfiction
    order: published_at desc
    limit: 999
  /art/:
    controller: channel
    template: tag-art
    filter: tag:art
    data: tag.art
    order: published_at desc
    limit: 999
  /micro/:
    controller: channel
    template: tag-micro
    filter: tag:micro
    data: tag.micro
    order: published_at desc
    limit: 999

collections:
  /digest/:
    permalink: /digest/{slug}/
    template: index
    filter: tag:hash-digest
    order: published_at desc
    limit: 999

  /life-on-words/:
    permalink: /life-on-words/{slug}/
    template: tag-podcast
    filter: primary_tag:podcast
    data: tag.podcast
    order: published_at desc
    limit: 999

  /white-rabbit/:
    permalink: /white-rabbit/{slug}/
    template: white-rabbit
    filter: tag:white-rabbit
    order: published_at desc
    limit: 999

  /review/:
    permalink: /review/{slug}/
    template: review
    filter: tag:-[hash-weekly-email,hash-digest,podcast]
    order: published_at desc
    limit: 12

taxonomies:
  tag: /by/{slug}/
  author: /author/{slug}/

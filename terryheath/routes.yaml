routes:
  /podcast/guests/:
    template: guest-guide
    data: page.guest-guide

collections:
  /podcast/:
    permalink: /podcast/{slug}/
    template: podcast
    filter: primary_tag:podcast
    data: tag.podcast
    order: published_at desc

  /:
    permalink: /{slug}/
    template: index
    filter: tag:-podcast

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/

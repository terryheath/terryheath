name: Inkhorn Review weekly digest

on:
  schedule:
    # Every Sunday at 15:17 UTC (8:17 AM PDT / 7:17 AM PST)
    - cron: '17 15 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, change nothing)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @tryghost/admin-api

      - name: Run digest
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          # Scheduled runs are always live. Dispatch honours the checkbox.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node inkhorn/digest.js

      - name: Commit digest state
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ -f inkhorn/digest-state.json ]; then
            git add inkhorn/digest-state.json
          fi
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: digest watermark [skip ci]"
            git push
          fi

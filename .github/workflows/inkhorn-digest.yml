name: Inkhorn Review weekly digest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, change nothing)'
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run digest
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node inkhorn/digest.js

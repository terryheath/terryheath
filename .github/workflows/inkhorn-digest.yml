name: Inkhorn Review weekly digest

on:
  schedule:
    # Every Sunday at 15:00 UTC (8:00 AM PDT / 7:00 AM PST)
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, change nothing)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @tryghost/admin-api

      - name: Run digest
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          DRY_RUN: >-
            ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node inkhorn/digest.js

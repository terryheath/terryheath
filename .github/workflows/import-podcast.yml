name: Import podcast episodes to Ghost

on:
  schedule:
    # Every day at 13:17 UTC (6:17am PDT / 5:17am PST).
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, change nothing)'
        type: boolean
        default: true
      status:
        description: 'Post status (blank = use repo variable POST_STATUS)'
        type: choice
        options:
          - ''
          - draft
          - published
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @tryghost/admin-api rss-parser

      - name: Restore book cache
        uses: actions/cache@v4
        with:
          path: .book-cache.json
          key: book-cache-${{ github.run_id }}
          restore-keys: book-cache-

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/607719180653/locations/global/workloadIdentityPools/github-actions/providers/github-terryheath
          service_account: podcast-importer@whiterabbit-prod.iam.gserviceaccount.com

      - name: Fetch secrets from GCP Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            GHOST_API_URL:whiterabbit-prod/ghost-api-url-podcast
            GHOST_ADMIN_KEY:whiterabbit-prod/ghost-admin-key-podcast
            ISBNDB_KEY:whiterabbit-prod/isbndb-key
            NEWSLETTER_SLUG:whiterabbit-prod/newsletter-slug-podcast

      - name: Run importer
        env:
          GHOST_API_URL: ${{ steps.secrets.outputs.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ steps.secrets.outputs.GHOST_ADMIN_KEY }}
          ISBNDB_KEY: ${{ steps.secrets.outputs.ISBNDB_KEY }}
          BOOKSHOP_ID: '94291'
          HEADSHOT_DIR: ./headshots
          MAX_AGE_DAYS: '14'
          POST_STATUS: >-
            ${{ github.event.inputs.status || vars.POST_STATUS || 'draft' }}
          NEWSLETTER_SLUG: ${{ steps.secrets.outputs.NEWSLETTER_SLUG }}
          DRY_RUN: >-
            ${{ github.event.inputs.dry_run == 'true' && '1'
                || vars.DRY_RUN || '' }}
        run: node riverside-to-ghost.js
